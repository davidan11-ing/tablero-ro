<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ósmosis Inversa Permoda — tablero en vivo</title>
<style>
  :root{
    --bg:#F7F5F0; --panel:#FFFFFF; --panel2:#F4F2EC; --line:#D3D1C7;
    --txt:#2C2C2A; --dim:#5F5E5A; --accent:#0F6E56; --ok:#0F6E56; --bad:#A32D2D;
    --warn:#854F0B; --violet:#534AB7; --border:#E3E0D6;
    --cfeed:#185FA5; --cperm:#0F6E56; --crech:#BA7515; --cdrain:#8B897F;
  }
  @media (prefers-color-scheme: dark){
    :root:not([data-theme="light"]){
      --bg:#14161A; --panel:#1C1F24; --panel2:#22262C; --line:#343A42;
      --txt:#E8E6E1; --dim:#A3A099; --border:#2C3138;
      --accent:#4FC3A1; --ok:#4FC3A1; --bad:#E8736C; --warn:#D9A441;
    }
  }
  :root[data-theme="dark"]{
    --bg:#14161A; --panel:#1C1F24; --panel2:#22262C; --line:#343A42;
    --txt:#E8E6E1; --dim:#A3A099; --border:#2C3138;
    --accent:#4FC3A1; --ok:#4FC3A1; --bad:#E8736C; --warn:#D9A441;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{background:var(--bg); color:var(--txt); font-family:"Segoe UI",system-ui,sans-serif; font-size:14px;}

  header{padding:14px 20px 10px; background:#04342C; display:flex; align-items:center; gap:14px; flex-wrap:wrap;}
  header h1{font-size:17px; letter-spacing:.3px; color:#fff; font-weight:600;}
  header h1 span{color:#9FE1CB;}
  .estado{margin-left:auto; display:flex; align-items:center; gap:8px; font-size:12.5px; color:#9FE1CB;}
  .dot{width:9px; height:9px; border-radius:50%; background:#8B897F;}
  .dot.on{background:#4ADE80; box-shadow:0 0 7px rgba(74,222,128,.8);}
  .dot.off{background:#E8736C;}

  .conexion{background:var(--panel2); border-bottom:1px solid var(--border); padding:10px 20px;
            display:flex; gap:10px; align-items:flex-end; flex-wrap:wrap;}
  .campo{display:flex; flex-direction:column; gap:3px;}
  .campo label{font-size:10.5px; color:var(--dim); text-transform:uppercase; letter-spacing:.4px;}
  .campo input{background:var(--panel); border:1px solid var(--line); color:var(--txt);
               padding:6px 9px; border-radius:5px; font-family:Consolas,monospace; font-size:12.5px;}
  .campo input:focus{outline:2px solid var(--accent); outline-offset:-1px;}
  button{background:var(--accent); color:#fff; border:none; padding:7px 15px; border-radius:5px;
         cursor:pointer; font-size:13px; font-family:inherit; font-weight:600;}
  button.sec{background:transparent; color:var(--dim); border:1px solid var(--line);}
  button:disabled{opacity:.45; cursor:default;}
  .aviso{font-size:11.5px; color:var(--dim); width:100%; margin-top:2px;}

  .alarma{display:none; padding:11px 20px; background:#FCEBEB; color:#A32D2D;
          border-bottom:1px solid #E8C4C4; font-weight:600; font-size:14px;}
  .alarma.ver{display:block;}
  .alarma b{font-size:15px;}
  :root[data-theme="dark"] .alarma, :root:not([data-theme="light"]) .alarma{background:#3A1E1E; color:#E8736C; border-color:#4A2A2A;}

  main{padding:14px 20px 40px; max-width:1500px; margin:0 auto;}

  .tira{display:grid; grid-template-columns:repeat(auto-fit,minmax(118px,1fr)); gap:9px; margin-bottom:16px;}
  .kpi{background:var(--panel); border:1px solid var(--border); border-radius:8px; padding:9px 11px;}
  .kpi .t{font-size:10px; color:var(--dim); text-transform:uppercase; letter-spacing:.4px; font-family:Consolas,monospace;}
  .kpi .v{font-size:21px; font-weight:600; font-variant-numeric:tabular-nums; margin-top:2px; line-height:1.15;}
  .kpi .u{font-size:11px; color:var(--dim); font-weight:400; margin-left:2px;}
  .kpi.viejo .v{color:var(--dim); opacity:.5;}
  .kpi.malo .v{color:var(--bad);}

  .fila{display:grid; grid-template-columns:1fr 290px; gap:14px; align-items:start;}
  @media (max-width:1000px){ .fila{grid-template-columns:1fr;} }

  .caja{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:12px 14px;}
  .caja h2{font-size:12.5px; text-transform:uppercase; letter-spacing:.6px; color:var(--dim);
           margin-bottom:10px; font-weight:600;}

  .pasos{display:flex; flex-direction:column; gap:5px;}
  .paso{display:flex; align-items:center; gap:9px; padding:5px 8px; border-radius:5px; font-size:12.5px;}
  .paso .n{font-family:Consolas,monospace; color:var(--dim); font-size:11px; min-width:20px;}
  .paso.act{background:rgba(15,110,86,.11); color:var(--accent); font-weight:600;}
  :root[data-theme="dark"] .paso.act, :root:not([data-theme="light"]) .paso.act{background:rgba(79,195,161,.14);}

  .datos{display:flex; flex-direction:column; gap:7px;}
  .dato{display:flex; justify-content:space-between; font-size:13px; padding-bottom:5px; border-bottom:1px solid var(--border);}
  .dato:last-child{border-bottom:none;}
  .dato .e{color:var(--dim);}
  .dato .v{font-family:Consolas,monospace; font-variant-numeric:tabular-nums;}

  /* ---- SVG, mismo lenguaje que el esquemático ---- */
  .svgbox{background:var(--panel); border:1px solid var(--border); border-radius:10px; padding:8px; overflow-x:auto;}
  svg{display:block; width:100%; min-width:680px;}
  .pipe{fill:none; stroke:#CFCCC2; stroke-width:4; stroke-linejoin:round; opacity:.35;}
  .pipe.on{opacity:1; stroke-dasharray:11 8; animation:flow .9s linear infinite;}
  .pipe.on.fl-feed{stroke:var(--cfeed);} .pipe.on.fl-perm{stroke:var(--cperm);} .pipe.on.fl-rech{stroke:var(--crech);}
  @keyframes flow{to{stroke-dashoffset:-19;}}
  .eqlbl{fill:var(--txt); font-size:11px; font-weight:600; text-anchor:middle;}
  .eqsub{fill:var(--dim); font-size:9px; text-anchor:middle;}
  .eq .body{fill:var(--panel2); stroke:#9A9890; stroke-width:1.5;}
  .eq.run .body{stroke:var(--ok); stroke-width:2;}
  .eq.run .imp{animation:spin 1.1s linear infinite; transform-box:fill-box; transform-origin:center;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .instr circle{fill:var(--panel); stroke:#5F5E5A; stroke-width:1.4;}
  .instr .tag{fill:var(--txt); font-size:8.5px; font-weight:700; text-anchor:middle; font-family:Consolas,monospace;}
  .instr .val{fill:var(--accent); font-size:10px; font-weight:700; text-anchor:middle;
              font-family:Consolas,monospace; font-variant-numeric:tabular-nums;}
  .instr.sin .val{fill:var(--dim); opacity:.45;}
  .instr.alerta circle{stroke:var(--bad); stroke-width:2.4;}
  .instr.alerta .val{fill:var(--bad);}
  .leader{stroke:#9A9890; stroke-width:1; stroke-dasharray:2 3; fill:none;}
  .liquid{fill:var(--cfeed); opacity:.4;}

  footer{padding:14px 20px; color:var(--dim); font-size:11.5px; text-align:center;}
</style>
</head>
<body>

<header>
  <h1>Ósmosis Inversa <span>Permoda</span> — tablero en vivo</h1>
  <div class="estado">
    <span class="dot" id="dot"></span>
    <span id="estadoTxt">sin conectar</span>
    <span id="ultimo" style="opacity:.7"></span>
  </div>
</header>

<div class="conexion" id="barra">
  <div class="campo" style="flex:1 1 300px">
    <label>Servidor</label>
    <input id="host" value="r66a66bd.ala.us-east-1.emqxsl.com">
  </div>
  <div class="campo" style="width:92px">
    <label>Puerto</label>
    <input id="puerto" value="8084">
  </div>
  <div class="campo" style="width:130px">
    <label>Usuario</label>
    <input id="usuario" value="visor">
  </div>
  <div class="campo" style="width:160px">
    <label>Contraseña</label>
    <input id="clave" type="password" placeholder="la escribes tú">
  </div>
  <button id="btn">Conectar</button>
  <button class="sec" id="btnTema">Tema</button>
  <div class="aviso" id="aviso">La contraseña se queda en este navegador y no se envía a ningún sitio salvo al broker.</div>
</div>

<div class="alarma" id="alarma"></div>

<main>
  <div class="tira" id="tira"></div>

  <div class="fila">
    <div class="svgbox"><svg id="pid" viewBox="0 0 1180 430" xmlns="http://www.w3.org/2000/svg"></svg></div>

    <div style="display:flex; flex-direction:column; gap:14px;">
      <div class="caja">
        <h2>Secuencia RO1</h2>
        <div class="pasos" id="pasos"></div>
      </div>
      <div class="caja">
        <h2>Estado</h2>
        <div class="datos" id="estadoLista"></div>
      </div>
    </div>
  </div>
</main>

<footer>
  Los datos llegan por MQTT desde el CBOX. Esta página solo lee: no puede mandar órdenes a la planta.
</footer>

<script src="https://cdnjs.cloudflare.com/ajax/libs/mqtt/5.10.1/mqtt.min.js"></script>
<script>
/* ============================================================
   Tablero en vivo — Ósmosis Inversa Permoda
   Lee los tópicos permoda/# del broker MQTT y pinta los valores.
   El lenguaje visual sigue el de Esquematico_RO_Permoda.html.
   ============================================================ */

const NS='http://www.w3.org/2000/svg';
const svg=document.getElementById('pid');
const el=(n,a,p)=>{const e=document.createElementNS(NS,n); for(const k in a)e.setAttribute(k,a[k]); (p||svg).appendChild(e); return e;};
const txt=(x,y,s,cls,p)=>{const t=el('text',{x,y,class:cls},p); t.textContent=s; return t;};

const capas={tubos:el('g',{}), equipos:el('g',{}), instr:el('g',{})};

/* ---------- piezas de dibujo ---------- */
function tanque(id,x,y,w,h,label,sub){
  const g=el('g',{class:'eq',id:'eq_'+id},capas.equipos);
  el('rect',{x,y,width:w,height:h,rx:7,class:'body'},g);
  el('rect',{x:x+3,y:y+h-16,width:w-6,height:13,rx:3,class:'liquid',id:'lvl_'+id},g);
  txt(x+w/2,y+h+14,label,'eqlbl',g);
  if(sub) txt(x+w/2,y+h+25,sub,'eqsub',g);
  return g;
}
function bomba(id,cx,cy,label,sub){
  const g=el('g',{class:'eq',id:'eq_'+id},capas.equipos);
  el('circle',{cx,cy,r:17,class:'body'},g);
  const imp=el('g',{class:'imp'},g);
  el('path',{d:`M${cx-9},${cy} L${cx+9},${cy} M${cx},${cy-9} L${cx},${cy+9}`,
             stroke:'#9A9890','stroke-width':2.2,fill:'none'},imp);
  txt(cx,cy+32,label,'eqlbl',g);
  if(sub) txt(cx,cy+42,sub,'eqsub',g);
  return g;
}
function membrana(id,x,y,w,label,sub){
  const h=38, g=el('g',{class:'eq',id:'eq_'+id},capas.equipos);
  el('rect',{x,y,width:w,height:h,rx:h/2,class:'body'},g);
  for(let i=0;i<4;i++) el('line',{x1:x+12+i*(w-24)/4,y1:y+5,x2:x+12+i*(w-24)/4,y2:y+h-5,
                                  stroke:'#9A9890','stroke-width':1},g);
  txt(x+w/2,y+h+14,label,'eqlbl',g);
  if(sub) txt(x+w/2,y+h+24,sub,'eqsub',g);
  return g;
}
function tubo(id,pts,fluido){
  return el('path',{d:'M'+pts.map(p=>p.join(',')).join(' L'),id:'pp_'+id,class:'pipe fl-'+fluido},capas.tubos);
}
/* burbuja de instrumento con hueco para el valor en vivo */
function instr(tag,x,y,lx,ly,unidad){
  const g=el('g',{class:'instr sin',id:'in_'+tag},capas.instr);
  g.dataset.tag=tag; g.dataset.unidad=unidad||'';
  if(lx!==null) el('path',{d:`M${x},${y} L${lx},${ly}`,class:'leader'},g);
  el('circle',{cx:x,cy:y,r:15},g);
  const p=tag.match(/^([A-Za-z]+)(.*)$/);
  txt(x,y-3,p[1],'tag',g);
  txt(x,y+6,p[2],'tag',g);
  txt(x,y+30,'--','val',g);
  if(unidad) txt(x,y+40,unidad,'eqsub',g);
  return g;
}

/* ---------- el tren de ósmosis ---------- */
tubo('a',[[70,120],[200,120]],'feed');
tubo('b',[[234,120],[330,120]],'feed');
tubo('c',[[364,120],[470,120]],'feed');
tubo('d',[[620,120],[700,120]],'feed');
tubo('e',[[850,120],[930,120]],'perm');
tubo('f',[[850,150],[930,150],[930,250]],'rech');
tubo('g',[[70,300],[200,300]],'feed');
tubo('h',[[234,300],[470,300]],'feed');
tubo('i',[[620,300],[760,300]],'perm');

tanque('TAQ401',30,80,40,80,'TAQ.4.01','efluente MBR');
bomba('BCE504',217,120,'BCE.5.04','alta presión');
bomba('BCE505',347,120,'BCE.5.05','booster');
membrana('RO11',470,101,150,'RO1-1','etapa 1');
membrana('RO12',700,101,150,'RO1-2','etapa 2');
tanque('TAQ507',30,260,40,80,'TAQ.5.07','permeado RO1');
bomba('BCE511',217,300,'BCE.5.11','alimentación RO2');
membrana('RO2',470,281,150,'RO2','afino');
tanque('TAQ513',760,260,40,80,'TAQ.5.13','agua tratada');

txt(960,124,'→ reúso','eqsub').setAttribute('text-anchor','start');
txt(960,254,'→ rechazo','eqsub').setAttribute('text-anchor','start');

instr('LT401',50,50,50,78,'m');
instr('FT501',150,60,150,118,'m³/h');
instr('PH501',283,60,283,118,'pH');
instr('PT501',420,60,420,118,'bar');
instr('PT502',660,60,660,118,'bar');
instr('FT504',890,60,890,118,'m³/h');
instr('CT502',890,200,890,152,'µS/cm');
instr('LT507',50,230,50,258,'m');
instr('PH506',150,240,150,298,'pH');
instr('TT507',283,240,283,298,'°C');
instr('PT509',420,240,420,298,'bar');
instr('CT511',700,240,700,298,'µS/cm');
instr('LT513',780,230,780,258,'m');

/* ---------- KPI ---------- */
const KPIS=[
  ['FT501','Caudal RO1','m³/h'], ['FT504','Permeado','m³/h'],
  ['PT501','Presión E1','bar'], ['PT502','Presión E2','bar'],
  ['CT502','Conduct. RO1','µS/cm'], ['CT511','Conduct. RO2','µS/cm'],
  ['PH501','pH entrada',''], ['LT401','Nivel TAQ401','m'],
  ['Hz504','BCE.5.04','Hz'], ['Hz505','BCE.5.05','Hz'],
];
const tira=document.getElementById('tira');
KPIS.forEach(([k,t,u])=>{
  const d=document.createElement('div'); d.className='kpi'; d.id='kpi_'+k;
  d.innerHTML=`<div class="t">${t}</div><div class="v">--<span class="u">${u}</span></div>`;
  tira.appendChild(d);
});

/* ---------- secuencia ---------- */
const PASOS=[[0,'PARADO'],[10,'START — abre FCV.5.02'],[11,'START SF — entrada filtros'],
             [12,'BCE.4.01'],[13,'BCE.5.04'],[14,'BCE.5.05'],[15,'EN MARCHA'],
             [21,'STOP BCE.5.05'],[22,'STOP BCE.5.04'],[23,'OPEN FCV.5.01'],[24,'CLOSE FCV.5.02']];
const cPasos=document.getElementById('pasos');
PASOS.forEach(([n,t])=>{
  const d=document.createElement('div'); d.className='paso'; d.id='paso_'+n;
  d.innerHTML=`<span class="n">${n}</span><span>${t}</span>`;
  cPasos.appendChild(d);
});

const CAUSAS={1:'Nivel bajo LT401',2:'Nivel alto LT507',3:'Equipos no listos',4:'Timeout de acción',
  5:'Caudal bajo FT501',6:'Presión alta PT501',7:'Presión alta PT502',8:'pH',9:'ORP',
  10:'PSL501',11:'Parada de emergencia',12:'Timeout de filtro',13:'Parada manual'};

/* ---------- estado de los datos ---------- */
let ultimoDato=0;
const valores={};

/* El CBOX publica las claves con el nombre del dispositivo delante
   (PLC_RO_FT501). Aquí se lo quitamos para no tener que editar trece
   celdas en el equipo cada vez que cambie algo. */
function normaliza(obj){
  const out={};
  for(const k in obj) out[k.replace(/^PLC_RO_/, '')] = obj[k];
  return out;
}

function pinta(bruto){
  const obj = normaliza(bruto);
  for(const k in obj){
    if(k==='ts') continue;
    valores[k]=obj[k];
    const g=document.getElementById('in_'+k);
    if(g){
      const v=g.querySelector('.val');
      v.textContent=(typeof obj[k]==='number')? obj[k].toFixed(obj[k]%1?2:1) : obj[k];
      g.classList.remove('sin');
    }
    const kp=document.getElementById('kpi_'+k);
    if(kp){
      const u=kp.querySelector('.u').outerHTML;
      kp.querySelector('.v').innerHTML=((typeof obj[k]==='number')?obj[k].toFixed(obj[k]%1?2:1):obj[k])+u;
      kp.classList.remove('viejo');
    }
  }
  // pH imposible: lo marcamos en vez de fingir que es un dato bueno
  marcaSiRaro('PH501', v=>v<0||v>14);
  marcaSiRaro('PH506', v=>v<0||v>14);
  /* El CBOX publica el estado en el mismo mensaje, no en un tópico aparte. */
  if(obj.step!==undefined) pintaEstado(obj);
  ultimoDato=Date.now();
}
function marcaSiRaro(tag,fn){
  const g=document.getElementById('in_'+tag); if(!g) return;
  const v=valores[tag];
  g.classList.toggle('alerta', typeof v==='number' && fn(v));
}

/* El CBOX manda el estado dentro del mismo mensaje de proceso, así que
   esta función tiene que funcionar con lo que haya: puede faltar casi todo. */
function pintaEstado(e){
  if(e.step===undefined) return;
  const paso = Number(e.step);

  document.querySelectorAll('.paso').forEach(p=>p.classList.remove('act'));
  const act=document.getElementById('paso_'+paso);
  if(act) act.classList.add('act');

  const enMarcha = paso>=12 && paso<=15;
  ['eq_BCE504','eq_BCE505','eq_RO11','eq_RO12'].forEach(id=>{
    const g=document.getElementById(id); if(g) g.classList.toggle('run', enMarcha);
  });
  ['pp_a','pp_b','pp_c','pp_d','pp_e','pp_f'].forEach(id=>{
    const p=document.getElementById(id); if(p) p.classList.toggle('on', enMarcha);
  });

  const nombre = e.step_txt || (PASOS.find(p=>p[0]===paso)||[,''])[1] || '';
  const filas = [['Paso', paso + (nombre? ' · '+nombre : '')]];

  if(e.run_min!==undefined){
    const h=Math.floor(e.run_min/60), m=e.run_min%60;
    filas.push(['Tiempo de marcha', h+' h '+m+' min']);
  }
  if(e.cmd!==undefined) filas.push(['Comando', e.cmd]);
  if(e.F1!==undefined)  filas.push(['Filtros 1/2/3', `${e.F1} / ${e.F2} / ${e.F3}`]);
  /* 'codigo' es la causa del ÚLTIMO paro, no una alarma activa: se informa,
     no se pinta en rojo. */
  if(e.codigo!==undefined && Number(e.codigo)>0)
    filas.push(['Último paro', CAUSAS[Number(e.codigo)] || ('código '+e.codigo)]);

  document.getElementById('estadoLista').innerHTML =
    filas.map(([k,v])=>`<div class="dato"><span class="e">${k}</span><span class="v">${v}</span></div>`).join('');
}

function pintaAlarma(a){
  const d=document.getElementById('alarma');
  if(a && a.activa){
    const causa=a.texto||CAUSAS[a.codigo]||('código '+a.codigo);
    d.innerHTML=`<b>⚠ ${causa}</b> — en el paso ${a.paso}${a.ts?' · '+a.ts:''}`;
    d.classList.add('ver');
  } else {
    d.classList.remove('ver');
  }
}

/* datos viejos: mejor decirlo que mostrar un número que ya no es cierto */
setInterval(()=>{
  const u=document.getElementById('ultimo');
  if(!ultimoDato){ u.textContent=''; return; }
  const s=Math.round((Date.now()-ultimoDato)/1000);
  u.textContent='· hace '+(s<60? s+' s' : Math.round(s/60)+' min');
  const viejo=s>30;
  document.querySelectorAll('.kpi').forEach(k=>k.classList.toggle('viejo',viejo));
  document.querySelectorAll('.instr').forEach(g=>g.classList.toggle('sin',viejo));
},1000);

/* ---------- MQTT ---------- */
let cliente=null;
const dot=document.getElementById('dot'), estadoTxt=document.getElementById('estadoTxt');
const btn=document.getElementById('btn');

function estado(clase,texto){ dot.className='dot '+clase; estadoTxt.textContent=texto; }

btn.onclick=()=>{
  if(cliente){ cliente.end(true); cliente=null; btn.textContent='Conectar'; estado('','desconectado'); return; }
  const host=document.getElementById('host').value.trim();
  const puerto=document.getElementById('puerto').value.trim();
  const usuario=document.getElementById('usuario').value.trim();
  const clave=document.getElementById('clave').value;
  if(!clave){ document.getElementById('aviso').textContent='Falta la contraseña.'; return; }
  try{ localStorage.setItem('ro_host',host); localStorage.setItem('ro_user',usuario); }catch(e){}

  estado('','conectando…');
  cliente=mqtt.connect(`wss://${host}:${puerto}/mqtt`,{
    username:usuario, password:clave, clientId:'tablero-'+Math.random().toString(16).slice(2,10),
    reconnectPeriod:4000, connectTimeout:12000, clean:true
  });
  cliente.on('connect',()=>{
    estado('on','conectado'); btn.textContent='Desconectar';
    document.getElementById('aviso').textContent='Conectado. Esperando datos de la planta…';
    cliente.subscribe('permoda/#',{qos:1});
  });
  cliente.on('reconnect',()=>estado('','reconectando…'));
  cliente.on('error',e=>{
    estado('off','error: '+(e&&e.message?e.message:'sin detalle'));
    document.getElementById('aviso').textContent='Si dice "Not authorized", revisa usuario y contraseña.';
  });
  cliente.on('close',()=>{ if(cliente) estado('off','desconectado'); });
  cliente.on('message',(t,p)=>{
    let d; try{ d=JSON.parse(p.toString()); }catch(e){ return; }
    if(t.endsWith('/alarma')) pintaAlarma(normaliza(d));
    else if(t.endsWith('/estado')) pintaEstado(normaliza(d));
    else pinta(d);   // cualquier otro tópico se trata como datos de proceso
  });
};

try{
  const h=localStorage.getItem('ro_host'), u=localStorage.getItem('ro_user');
  if(h) document.getElementById('host').value=h;
  if(u) document.getElementById('usuario').value=u;
}catch(e){}

document.getElementById('btnTema').onclick=()=>{
  const r=document.documentElement;
  const oscuro=r.getAttribute('data-theme')==='dark';
  r.setAttribute('data-theme', oscuro?'light':'dark');
  try{ localStorage.setItem('ro_tema', oscuro?'light':'dark'); }catch(e){}
};
try{ const t=localStorage.getItem('ro_tema'); if(t) document.documentElement.setAttribute('data-theme',t); }catch(e){}
</script>
</body>
</html>
